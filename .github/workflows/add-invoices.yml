name: Add Invoices Module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate invoices module files
        run: |
          mkdir -p src/app/dashboard/invoices
          mkdir -p 'src/app/dashboard/invoices/[invoiceId]'
          mkdir -p 'src/app/dashboard/invoices/[invoiceId]/print'
          mkdir -p 'src/app/dashboard/service-requests/[requestId]/invoice'

          cat > src/app/dashboard/invoices/actions.ts <<'EOF'
          "use server";

          import { redirect } from "next/navigation";
          import type { PaymentStatus } from "@prisma/client";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requirePermission } from "@/lib/permissions";
          import { requireTenantContext } from "@/lib/tenant-context";

          function cleanText(value: FormDataEntryValue | null) {
            return String(value || "").trim();
          }

          function toMoney(value: FormDataEntryValue | null) {
            const raw = String(value || "0")
              .replace(/,/g, "")
              .replace(/[^\d.-]/g, "");

            const number = Number(raw);

            if (Number.isNaN(number) || number < 0) {
              return 0;
            }

            return number;
          }

          function errorRedirect(path: string, message: string): never {
            redirect(`${path}?error=${encodeURIComponent(message)}`);
          }

          async function generateInvoiceNumber(tenantId: string) {
            const year = new Date().getFullYear();
            const prefix = `INV-${year}`;

            const count = await prisma.invoice.count({
              where: {
                tenantId,
                invoiceNumber: {
                  startsWith: prefix
                }
              }
            });

            const number = String(count + 1).padStart(5, "0");

            return `${prefix}-${number}`;
          }

          const validPaymentStatuses: PaymentStatus[] = ["UNPAID", "PAID", "PARTIAL"];

          export async function createInvoiceAction(formData: FormData) {
            const context = await requireTenantContext();

            await requireModule(context.tenantId, "invoices");
            requirePermission(context.role, "invoices.create");

            const requestId = cleanText(formData.get("requestId"));
            const discount = toMoney(formData.get("discount"));
            const tax = toMoney(formData.get("tax"));
            const paymentStatusRaw = cleanText(formData.get("paymentStatus")) as PaymentStatus;

            const paymentStatus: PaymentStatus = validPaymentStatuses.includes(paymentStatusRaw)
              ? paymentStatusRaw
              : "UNPAID";

            if (!requestId) {
              errorRedirect("/dashboard/service-requests", "شناسه درخواست معتبر نیست.");
            }

            const request = await prisma.serviceRequest.findFirst({
              where: {
                id: requestId,
                tenantId: context.tenantId
              },
              include: {
                invoice: true,
                customer: true
              }
            });

            if (!request) {
              errorRedirect("/dashboard/service-requests", "درخواست تعمیر پیدا نشد.");
            }

            if (request.invoice) {
              errorRedirect(
                `/dashboard/service-requests/${requestId}`,
                "برای این درخواست قبلاً فاکتور صادر شده است."
              );
            }

            const titles = formData.getAll("itemTitle").map((item) => String(item || "").trim());
            const quantities = formData.getAll("itemQuantity");
            const unitPrices = formData.getAll("itemUnitPrice");

            const items = titles
              .map((title, index) => {
                const quantityRaw = Number(String(quantities[index] || "1"));
                const quantity = Number.isNaN(quantityRaw) || quantityRaw <= 0 ? 1 : quantityRaw;
                const unitPrice = toMoney(unitPrices[index] || "0");
                const total = quantity * unitPrice;

                return {
                  title,
                  quantity,
                  unitPrice,
                  total
                };
              })
              .filter((item) => item.title && item.total > 0);

            if (items.length === 0) {
              errorRedirect(
                `/dashboard/service-requests/${requestId}/invoice`,
                "حداقل یک آیتم معتبر برای فاکتور وارد کنید."
              );
            }

            const subtotal = items.reduce((sum, item) => sum + item.total, 0);
            const total = Math.max(subtotal - discount + tax, 0);
            const invoiceNumber = await generateInvoiceNumber(context.tenantId);

            const invoice = await prisma.$transaction(async (tx) => {
              const createdInvoice = await tx.invoice.create({
                data: {
                  tenantId: context.tenantId,
                  serviceRequestId: request.id,
                  customerId: request.customerId,
                  invoiceNumber,
                  subtotal,
                  discount,
                  tax,
                  total,
                  paymentStatus
                }
              });

              for (const item of items) {
                await tx.invoiceItem.create({
                  data: {
                    tenantId: context.tenantId,
                    invoiceId: createdInvoice.id,
                    title: item.title,
                    quantity: item.quantity,
                    unitPrice: item.unitPrice,
                    total: item.total
                  }
                });
              }

              await tx.auditLog.create({
                data: {
                  tenantId: context.tenantId,
                  userId: context.user.id,
                  action: "invoice.created",
                  entityType: "Invoice",
                  entityId: createdInvoice.id,
                  metadata: {
                    invoiceNumber,
                    serviceRequestId: request.id,
                    total
                  }
                }
              });

              return createdInvoice;
            });

            redirect(`/dashboard/invoices/${invoice.id}`);
          }

          export async function updateInvoicePaymentStatusAction(formData: FormData) {
            const context = await requireTenantContext();

            await requireModule(context.tenantId, "invoices");
            requirePermission(context.role, "invoices.update_payment");

            const invoiceId = cleanText(formData.get("invoiceId"));
            const paymentStatusRaw = cleanText(formData.get("paymentStatus")) as PaymentStatus;

            if (!invoiceId || !validPaymentStatuses.includes(paymentStatusRaw)) {
              errorRedirect("/dashboard/invoices", "اطلاعات وضعیت پرداخت معتبر نیست.");
            }

            const invoice = await prisma.invoice.findFirst({
              where: {
                id: invoiceId,
                tenantId: context.tenantId
              }
            });

            if (!invoice) {
              errorRedirect("/dashboard/invoices", "فاکتور پیدا نشد.");
            }

            await prisma.invoice.update({
              where: {
                id: invoiceId
              },
              data: {
                paymentStatus: paymentStatusRaw
              }
            });

            await prisma.auditLog.create({
              data: {
                tenantId: context.tenantId,
                userId: context.user.id,
                action: "invoice.payment_status_updated",
                entityType: "Invoice",
                entityId: invoiceId,
                metadata: {
                  from: invoice.paymentStatus,
                  to: paymentStatusRaw
                }
              }
            });

            redirect(
              `/dashboard/invoices/${invoiceId}?success=${encodeURIComponent(
                "وضعیت پرداخت فاکتور ذخیره شد."
              )}`
            );
          }
          EOF

          cat > src/app/dashboard/invoices/page.tsx <<'EOF'
          import Link from "next/link";
          import type { PaymentStatus } from "@prisma/client";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requireTenantContext } from "@/lib/tenant-context";

          const paymentStatusLabels: Record<PaymentStatus, string> = {
            UNPAID: "پرداخت‌نشده",
            PAID: "پرداخت‌شده",
            PARTIAL: "پرداخت بخشی"
          };

          const paymentOptions: Array<{ value: PaymentStatus | ""; label: string }> = [
            { value: "", label: "همه وضعیت‌ها" },
            { value: "UNPAID", label: "پرداخت‌نشده" },
            { value: "PAID", label: "پرداخت‌شده" },
            { value: "PARTIAL", label: "پرداخت بخشی" }
          ];

          const validPaymentStatuses = paymentOptions
            .map((item) => item.value)
            .filter(Boolean) as PaymentStatus[];

          export default async function InvoicesPage({
            searchParams
          }: {
            searchParams?: Promise<{ q?: string; paymentStatus?: string; error?: string; success?: string }>;
          }) {
            const context = await requireTenantContext();
            await requireModule(context.tenantId, "invoices");

            const params = await searchParams;
            const q = String(params?.q || "").trim();
            const paymentStatusRaw = String(params?.paymentStatus || "").trim() as PaymentStatus;
            const paymentStatus = validPaymentStatuses.includes(paymentStatusRaw)
              ? paymentStatusRaw
              : undefined;

            const invoices = await prisma.invoice.findMany({
              where: {
                tenantId: context.tenantId,
                ...(paymentStatus ? { paymentStatus } : {}),
                ...(q
                  ? {
                      OR: [
                        {
                          invoiceNumber: {
                            contains: q,
                            mode: "insensitive"
                          }
                        },
                        {
                          serviceRequest: {
                            trackingCode: {
                              contains: q,
                              mode: "insensitive"
                            }
                          }
                        },
                        {
                          customer: {
                            OR: [
                              {
                                firstName: {
                                  contains: q,
                                  mode: "insensitive"
                                }
                              },
                              {
                                lastName: {
                                  contains: q,
                                  mode: "insensitive"
                                }
                              },
                              {
                                mobile: {
                                  contains: q
                                }
                              }
                            ]
                          }
                        }
                      ]
                    }
                  : {})
              },
              include: {
                customer: true,
                serviceRequest: {
                  include: {
                    appliance: true
                  }
                },
                items: true
              },
              orderBy: {
                createdAt: "desc"
              },
              take: 100
            });

            const totalAmount = invoices.reduce(
              (sum, invoice) => sum + Number(invoice.total),
              0
            );

            const paidAmount = invoices
              .filter((invoice) => invoice.paymentStatus === "PAID")
              .reduce((sum, invoice) => sum + Number(invoice.total), 0);

            return (
              <main className="app-shell">
                <aside className="sidebar">
                  <div>
                    <h2>سرویسیار</h2>
                    <p>{context.tenant.name}</p>

                    <nav>
                      <Link href="/dashboard">داشبورد</Link>
                      <Link href="/dashboard/customers">مشتریان</Link>
                      <Link href="/dashboard/service-requests">درخواست‌های تعمیر</Link>
                      <Link href="/dashboard/technicians">تکنسین‌ها</Link>
                      <Link href="/dashboard/invoices">فاکتورها</Link>
                      <Link href="/auth/activate">اشتراک و لایسنس</Link>
                    </nav>
                  </div>
                </aside>

                <section className="content">
                  <header className="page-header">
                    <div>
                      <span className="badge">مدیریت مالی</span>
                      <h1>فاکتورها</h1>
                      <p className="muted">
                        فاکتورهای صادرشده برای درخواست‌های تعمیر را مشاهده و مدیریت کنید.
                      </p>
                    </div>
                  </header>

                  {params?.error ? <div className="alert error">{params.error}</div> : null}
                  {params?.success ? <div className="alert success">{params.success}</div> : null}

                  <section className="stats-grid">
                    <div className="stat-card small">
                      <span>تعداد فاکتورها</span>
                      <strong>{invoices.length}</strong>
                    </div>

                    <div className="stat-card small">
                      <span>مجموع فاکتورها</span>
                      <strong className="stat-text">
                        {totalAmount.toLocaleString("fa-IR")} تومان
                      </strong>
                    </div>

                    <div className="stat-card small">
                      <span>پرداخت‌شده</span>
                      <strong className="stat-text">
                        {paidAmount.toLocaleString("fa-IR")} تومان
                      </strong>
                    </div>
                  </section>

                  <section className="panel">
                    <form className="search-form service-search">
                      <input
                        name="q"
                        defaultValue={q}
                        placeholder="جستجو با شماره فاکتور، کد پیگیری، نام یا موبایل مشتری"
                      />

                      <select name="paymentStatus" defaultValue={paymentStatus || ""}>
                        {paymentOptions.map((item) => (
                          <option key={item.value || "all"} value={item.value}>
                            {item.label}
                          </option>
                        ))}
                      </select>

                      <button className="button compact" type="submit">
                        جستجو
                      </button>

                      {(q || paymentStatus) ? (
                        <Link className="secondary-link" href="/dashboard/invoices">
                          حذف فیلتر
                        </Link>
                      ) : null}
                    </form>
                  </section>

                  <section className="panel">
                    {invoices.length === 0 ? (
                      <div className="empty-state">
                        <h3>هنوز فاکتوری صادر نشده است</h3>
                        <p className="muted">
                          برای صدور فاکتور، وارد جزئیات یک درخواست تعمیر شوید و گزینه صدور فاکتور را انتخاب کنید.
                        </p>
                        <Link className="button" href="/dashboard/service-requests">
                          مشاهده درخواست‌های تعمیر
                        </Link>
                      </div>
                    ) : (
                      <div className="table-wrapper">
                        <table>
                          <thead>
                            <tr>
                              <th>شماره فاکتور</th>
                              <th>کد درخواست</th>
                              <th>مشتری</th>
                              <th>دستگاه</th>
                              <th>مبلغ نهایی</th>
                              <th>وضعیت پرداخت</th>
                              <th>تاریخ صدور</th>
                              <th>عملیات</th>
                            </tr>
                          </thead>

                          <tbody>
                            {invoices.map((invoice) => (
                              <tr key={invoice.id}>
                                <td dir="ltr">
                                  <strong>{invoice.invoiceNumber}</strong>
                                </td>
                                <td dir="ltr">{invoice.serviceRequest.trackingCode}</td>
                                <td>
                                  {invoice.customer.firstName} {invoice.customer.lastName || ""}
                                  <br />
                                  <small dir="ltr">{invoice.customer.mobile}</small>
                                </td>
                                <td>
                                  {invoice.serviceRequest.appliance.type}
                                  <br />
                                  <small>{invoice.serviceRequest.appliance.brand || "برند نامشخص"}</small>
                                </td>
                                <td>{Number(invoice.total).toLocaleString("fa-IR")} تومان</td>
                                <td>
                                  <span className={`payment-pill payment-${invoice.paymentStatus.toLowerCase()}`}>
                                    {paymentStatusLabels[invoice.paymentStatus]}
                                  </span>
                                </td>
                                <td>{invoice.createdAt.toLocaleDateString("fa-IR")}</td>
                                <td>
                                  <div className="table-actions">
                                    <Link
                                      className="table-action"
                                      href={`/dashboard/invoices/${invoice.id}`}
                                    >
                                      مشاهده
                                    </Link>
                                    <Link
                                      className="table-action green"
                                      href={`/dashboard/invoices/${invoice.id}/print`}
                                    >
                                      چاپ
                                    </Link>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </section>
                </section>
              </main>
            );
          }
          EOF

          cat > 'src/app/dashboard/service-requests/[requestId]/invoice/page.tsx' <<'EOF'
          import Link from "next/link";
          import { notFound, redirect } from "next/navigation";
          import { createInvoiceAction } from "@/app/dashboard/invoices/actions";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requireTenantContext } from "@/lib/tenant-context";

          export default async function CreateInvoiceForRequestPage({
            params,
            searchParams
          }: {
            params: Promise<{ requestId: string }>;
            searchParams?: Promise<{ error?: string }>;
          }) {
            const context = await requireTenantContext();
            await requireModule(context.tenantId, "invoices");

            const { requestId } = await params;
            const query = await searchParams;

            const request = await prisma.serviceRequest.findFirst({
              where: {
                id: requestId,
                tenantId: context.tenantId
              },
              include: {
                customer: true,
                appliance: true,
                address: true,
                invoice: true,
                reports: {
                  orderBy: {
                    createdAt: "desc"
                  },
                  take: 1
                }
              }
            });

            if (!request) {
              notFound();
            }

            if (request.invoice) {
              redirect(`/dashboard/invoices/${request.invoice.id}`);
            }

            return (
              <main className="app-shell">
                <aside className="sidebar">
                  <div>
                    <h2>سرویسیار</h2>
                    <p>{context.tenant.name}</p>

                    <nav>
                      <Link href="/dashboard">داشبورد</Link>
                      <Link href="/dashboard/customers">مشتریان</Link>
                      <Link href="/dashboard/service-requests">درخواست‌های تعمیر</Link>
                      <Link href="/dashboard/technicians">تکنسین‌ها</Link>
                      <Link href="/dashboard/invoices">فاکتورها</Link>
                    </nav>
                  </div>
                </aside>

                <section className="content">
                  <header className="page-header">
                    <div>
                      <span className="badge">صدور فاکتور</span>
                      <h1>صدور فاکتور برای درخواست</h1>
                      <p className="muted">
                        درخواست: <span dir="ltr">{request.trackingCode}</span> - مشتری:{" "}
                        {request.customer.firstName} {request.customer.lastName || ""}
                      </p>
                    </div>

                    <Link
                      className="ghost-light-button"
                      href={`/dashboard/service-requests/${request.id}`}
                    >
                      بازگشت به درخواست
                    </Link>
                  </header>

                  {query?.error ? <div className="alert error">{query.error}</div> : null}

                  <section className="dashboard-grid">
                    <div className="panel">
                      <h3>خلاصه درخواست</h3>

                      <div className="info-list">
                        <p>
                          <strong>کد پیگیری:</strong>{" "}
                          <span dir="ltr">{request.trackingCode}</span>
                        </p>
                        <p>
                          <strong>مشتری:</strong> {request.customer.firstName}{" "}
                          {request.customer.lastName || ""}
                        </p>
                        <p>
                          <strong>موبایل:</strong>{" "}
                          <span dir="ltr">{request.customer.mobile}</span>
                        </p>
                        <p>
                          <strong>دستگاه:</strong> {request.appliance.type}
                          {request.appliance.brand ? ` - ${request.appliance.brand}` : ""}
                          {request.appliance.model ? ` - ${request.appliance.model}` : ""}
                        </p>
                        <p>
                          <strong>شرح مشکل:</strong> {request.problemDescription}
                        </p>
                        {request.reports[0] ? (
