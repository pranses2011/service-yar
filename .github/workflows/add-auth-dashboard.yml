          /* Auth and dashboard styles */

          .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
              radial-gradient(circle at top right, rgba(14, 165, 233, 0.14), transparent 32%),
              radial-gradient(circle at bottom left, rgba(15, 23, 42, 0.14), transparent 32%),
              #f6f7fb;
          }

          .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
