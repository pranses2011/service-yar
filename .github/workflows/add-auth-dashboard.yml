            border: 1px solid #e5e7eb;
          }

          code {
            direction: ltr;
            display: inline-block;
            background: #0f172a;
            color: #e0f2fe;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 13px;
          }

          .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr;
            background: #f6f7fb;
          }

          .sidebar {
            background: #0f172a;
            color: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 24px;
          }

          .sidebar h2 {
            margin: 0;
          }

          .sidebar p {
            color: #cbd5e1;
          }

          .sidebar nav {
            display: grid;
            gap: 8px;
            margin-top: 24px;
          }

          .sidebar nav a {
            display: block;
            padding: 12px 14px;
            border-radius: 12px;
            color: #e5e7eb;
          }

          .sidebar nav a:hover {
            background: rgba(255, 255, 255, 0.08);
          }

          .ghost-button {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            font-weight: 800;
          }

          .content {
            padding: 32px;
          }

          .topbar {
            margin-bottom: 24px;
          }

          .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 24px 0;
          }

          .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
          }

          .stat-card span {
            color: #6b7280;
            font-weight: 700;
          }

          .stat-card strong {
            display: block;
            margin-top: 10px;
            font-size: 32px;
            color: #0f172a;
          }

          .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
          }

          .panel {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
          }

          .info-list p {
            margin: 10px 0;
          }

          .module-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
          }

          .module-list span {
            background: #ecfeff;
            color: #155e75;
            border: 1px solid #a5f3fc;
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
          }

          @media (max-width: 820px) {
            .app-shell {
              grid-template-columns: 1fr;
            }

            .sidebar {
              position: static;
            }

            .content {
              padding: 20px;
            }

            .form.two-column {
              grid-template-columns: 1fr;
            }

            .span-2 {
              grid-column: span 1;
            }
          }
          EOF

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add auth, registration, license activation and dashboard"
            git push
          fi

      - name: Create ZIP file
        run: |
          zip -r servicyar-auth-dashboard.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicyar-auth-dashboard
          path: servicyar-auth-dashboard.zip
