          EOF

          cat > src/lib/prisma.ts <<'EOF'
          import { PrismaClient } from "@prisma/client";

          const globalForPrisma = globalThis as unknown as {
            prisma?: PrismaClient;
          };

          export const prisma =
            globalForPrisma.prisma ??
            new PrismaClient({
              log:
                process.env.NODE_ENV === "development"
                  ? ["query", "error", "warn"]
                  : ["error"]
            });

          if (process.env.NODE_ENV !== "production") {
            globalForPrisma.prisma = prisma;
          }
          EOF

          cat > src/lib/modules.ts <<'EOF'
          import { prisma } from "@/lib/prisma";

          export async function getTenantActiveModules(tenantId: string) {
            const tenantModules = await prisma.tenantModule.findMany({
              where: {
                tenantId,
                isEnabled: true,
                module: {
                  isActive: true
                }
              },
              include: {
                module: true
              }
            });

            return tenantModules.map((item) => item.module.code);
          }

          export function hasModule(activeModules: string[], moduleCode: string) {
            return activeModules.includes(moduleCode);
          }

          export async function requireModule(tenantId: string, moduleCode: string) {
            const activeModules = await getTenantActiveModules(tenantId);

            if (!hasModule(activeModules, moduleCode)) {
              throw new Error(`ماژول ${moduleCode} برای این کسب‌وکار فعال نیست.`);
            }

            return true;
          }
          EOF

          cat > src/lib/permissions.ts <<'EOF'
          import type { TenantRole } from "@prisma/client";

          type Permission =
            | "customers.read"
            | "customers.create"
            | "customers.update"
            | "customers.delete"
            | "service_requests.read"
            | "service_requests.create"
            | "service_requests.update"
            | "service_requests.assign"
            | "service_requests.read_assigned"
            | "service_reports.create"
            | "invoices.read"
            | "invoices.create"
            | "invoices.update_payment"
            | "users.manage"
            | "settings.manage"
            | "*";

          const permissionsByRole: Record<TenantRole, Permission[]> = {
            OWNER: ["*"],
            ADMIN: [
              "customers.read",
              "customers.create",
              "customers.update",
              "service_requests.read",
              "service_requests.create",
              "service_requests.update",
              "service_requests.assign",
              "service_reports.create",
              "invoices.read",
              "invoices.create",
              "invoices.update_payment",
              "users.manage",
              "settings.manage"
            ],
            OPERATOR: [
              "customers.read",
              "customers.create",
              "customers.update",
              "service_requests.read",
              "service_requests.create"
            ],
            TECHNICIAN: [
              "service_requests.read_assigned",
              "service_requests.update",
              "service_reports.create"
            ],
            ACCOUNTANT: [
              "customers.read",
              "service_requests.read",
              "invoices.read",
              "invoices.create",
              "invoices.update_payment"
            ]
          };

          export function can(role: TenantRole, permission: Permission) {
            const permissions = permissionsByRole[role];
            return permissions.includes("*") || permissions.includes(permission);
          }

          export function requirePermission(role: TenantRole, permission: Permission) {
            if (!can(role, permission)) {
              throw new Error("شما دسترسی لازم برای انجام این عملیات را ندارید.");
            }

            return true;
          }
          EOF

          cat > src/lib/license.ts <<'EOF'
          import { addDays } from "date-fns";
          import { prisma } from "@/lib/prisma";

          export async function activateLicense(params: {
            tenantId: string;
            licenseKey: string;
          }) {
            const { tenantId, licenseKey } = params;

            const license = await prisma.license.findUnique({
              where: { licenseKey },
              include: {
                plan: {
                  include: {
                    planModules: {
                      include: {
                        module: true
                      }
                    }
                  }
                }
              }
            });

            if (!license) {
              throw new Error("کد فعال‌سازی معتبر نیست.");
            }

            if (license.status !== "UNUSED") {
              throw new Error("این کد قبلاً استفاده شده یا قابل فعال‌سازی نیست.");
            }

            const now = new Date();
            const expiresAt = addDays(now, license.durationDays);

            await prisma.$transaction(async (tx) => {
              await tx.license.update({
                where: { id: license.id },
                data: {
                  tenantId,
                  status: "ACTIVE",
                  startsAt: now,
                  expiresAt,
                  activatedAt: now
                }
              });

              await tx.tenant.update({
                where: { id: tenantId },
                data: {
                  status: "ACTIVE"
                }
              });

              for (const planModule of license.plan.planModules) {
                await tx.tenantModule.upsert({
                  where: {
                    tenantId_moduleId: {
                      tenantId,
                      moduleId: planModule.moduleId
                    }
                  },
                  update: {
                    isEnabled: true
                  },
                  create: {
                    tenantId,
                    moduleId: planModule.moduleId,
                    isEnabled: true
                  }
                });
              }
            });

            return {
              success: true,
              expiresAt,
              plan: license.plan.nameFa
            };
          }

          export async function getTenantActiveLicense(tenantId: string) {
            return prisma.license.findFirst({
              where: {
                tenantId,
                status: "ACTIVE",
                OR: [
                  {
                    expiresAt: null
                  },
                  {
                    expiresAt: {
                      gt: new Date()
                    }
                  }
                ]
              },
              include: {
                plan: true
              },
              orderBy: {
                activatedAt: "desc"
              }
            });
          }

          export async function ensureTenantLicenseIsActive(tenantId: string) {
            const license = await getTenantActiveLicense(tenantId);

            if (!license) {
              throw new Error("اشتراک این کسب‌وکار فعال نیست یا منقضی شده است.");
            }

            return license;
          }
          EOF

          cat > prisma/schema.prisma <<'EOF'
          generator client {
            provider = "prisma-client-js"
          }

          datasource db {
            provider = "postgresql"
            url      = env("DATABASE_URL")
          }

          enum GlobalRole {
            USER
            SUPER_ADMIN
          }

          enum TenantRole {
            OWNER
            ADMIN
            OPERATOR
            TECHNICIAN
            ACCOUNTANT
          }

          enum TenantStatus {
            ACTIVE
            SUSPENDED
            EXPIRED
          }

          enum LicenseStatus {
            UNUSED
            ACTIVE
            EXPIRED
            SUSPENDED
            CANCELLED
          }

          enum ServiceRequestStatus {
            NEW
            PENDING_CALL
            ASSIGNED
            IN_PROGRESS
            WAITING_FOR_PART
            COMPLETED
            CANCELLED
          }

          enum RequestPriority {
            NORMAL
            URGENT
          }

          enum PaymentStatus {
            UNPAID
            PAID
            PARTIAL
          }

          model User {
            id           String     @id @default(uuid()) @db.Uuid
            name         String
            mobile       String     @unique
            email        String?    @unique
            passwordHash String
            globalRole   GlobalRole @default(USER)
            isActive     Boolean    @default(true)

            ownedTenants            Tenant[]         @relation("TenantOwner")
            tenantMemberships       TenantUser[]
            createdServiceRequests  ServiceRequest[] @relation("ServiceRequestCreator")
            assignedServiceRequests ServiceRequest[] @relation("ServiceRequestTechnician")
            serviceReports          ServiceReport[]  @relation("ReportTechnician")
            auditLogs               AuditLog[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([mobile])
            @@index([globalRole])
          }

          model Tenant {
            id          String       @id @default(uuid()) @db.Uuid
            name        String
            slug        String       @unique
            mobile      String?
            phone       String?
            city        String?
            address     String?
            logoUrl     String?
            status      TenantStatus @default(ACTIVE)

            ownerUserId String @db.Uuid
            owner       User   @relation("TenantOwner", fields: [ownerUserId], references: [id])

            users           TenantUser[]
            licenses        License[]
            tenantModules   TenantModule[]
            customers       Customer[]
            addresses       CustomerAddress[]
            appliances      Appliance[]
            serviceRequests ServiceRequest[]
            serviceReports  ServiceReport[]
            invoices        Invoice[]
            invoiceItems    InvoiceItem[]
            auditLogs       AuditLog[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([ownerUserId])
            @@index([status])
          }

          model TenantUser {
            id       String     @id @default(uuid()) @db.Uuid
            tenantId String     @db.Uuid
            userId   String     @db.Uuid
            role     TenantRole
            isActive Boolean    @default(true)

            tenant Tenant @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            user   User   @relation(fields: [userId], references: [id], onDelete: Cascade)

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@unique([tenantId, userId])
            @@index([tenantId])
            @@index([userId])
            @@index([tenantId, role])
          }

          model Module {
            id          String  @id @default(uuid()) @db.Uuid
            code        String  @unique
            nameFa      String
            description String?
            isActive    Boolean @default(true)

            planModules   PlanModule[]
            tenantModules TenantModule[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
          }

          model Plan {
            id                 String   @id @default(uuid()) @db.Uuid
            code               String   @unique
            nameFa             String
            description        String?
            priceMonthly       Decimal? @db.Decimal(18, 2)
            priceYearly        Decimal? @db.Decimal(18, 2)
            maxUsers           Int
            maxTechnicians     Int
            maxMonthlyRequests Int?
            isActive           Boolean  @default(true)

            planModules PlanModule[]
            licenses    License[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt
          }

          model PlanModule {
            id       String @id @default(uuid()) @db.Uuid
            planId   String @db.Uuid
            moduleId String @db.Uuid

            plan   Plan   @relation(fields: [planId], references: [id], onDelete: Cascade)
            module Module @relation(fields: [moduleId], references: [id], onDelete: Cascade)

            createdAt DateTime @default(now())

            @@unique([planId, moduleId])
          }

          model License {
            id         String        @id @default(uuid()) @db.Uuid
            licenseKey String        @unique
            status     LicenseStatus @default(UNUSED)

            tenantId String? @db.Uuid
            planId   String  @db.Uuid

            durationDays       Int @default(365)
            maxUsers           Int
            maxTechnicians     Int
            maxMonthlyRequests Int?

            startsAt    DateTime?
            expiresAt   DateTime?
            activatedAt DateTime?

            tenant Tenant? @relation(fields: [tenantId], references: [id])
            plan   Plan    @relation(fields: [planId], references: [id])

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([tenantId])
            @@index([planId])
            @@index([status])
            @@index([expiresAt])
          }

          model TenantModule {
            id        String  @id @default(uuid()) @db.Uuid
            tenantId  String  @db.Uuid
            moduleId  String  @db.Uuid
            isEnabled Boolean @default(true)

            tenant Tenant @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            module Module @relation(fields: [moduleId], references: [id], onDelete: Cascade)

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@unique([tenantId, moduleId])
          }

          model Customer {
            id        String  @id @default(uuid()) @db.Uuid
            tenantId  String  @db.Uuid
            firstName String
            lastName  String?
            mobile    String
            phone     String?
            notes     String?

            tenant          Tenant            @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            addresses       CustomerAddress[]
            appliances      Appliance[]
            serviceRequests ServiceRequest[]
            invoices        Invoice[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@unique([tenantId, mobile])
            @@index([tenantId])
            @@index([mobile])
          }

          model CustomerAddress {
            id          String  @id @default(uuid()) @db.Uuid
            tenantId    String  @db.Uuid
            customerId  String  @db.Uuid
            city        String
            address     String
            postalCode  String?
            plate       String?
            unit        String?
            description String?

            tenant   Tenant   @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            customer Customer @relation(fields: [customerId], references: [id], onDelete: Cascade)

            serviceRequests ServiceRequest[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([tenantId])
            @@index([customerId])
          }

          model Appliance {
            id           String  @id @default(uuid()) @db.Uuid
            tenantId     String  @db.Uuid
            customerId   String  @db.Uuid
            type         String
            brand        String?
            model        String?
            serialNumber String?
            notes        String?

            tenant   Tenant   @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            customer Customer @relation(fields: [customerId], references: [id], onDelete: Cascade)

            serviceRequests ServiceRequest[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([tenantId])
            @@index([customerId])
            @@index([type])
          }

          model ServiceRequest {
            id       String @id @default(uuid()) @db.Uuid
            tenantId String @db.Uuid

            customerId  String @db.Uuid
            addressId   String @db.Uuid
            applianceId String @db.Uuid

            assignedTechnicianUserId String? @db.Uuid
            createdByUserId          String  @db.Uuid

            trackingCode       String
            problemDescription String
            status             ServiceRequestStatus @default(NEW)
            priority           RequestPriority       @default(NORMAL)

            scheduledAt   DateTime?
            internalNotes String?

            tenant    Tenant          @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            customer  Customer        @relation(fields: [customerId], references: [id])
            address   CustomerAddress @relation(fields: [addressId], references: [id])
            appliance Appliance       @relation(fields: [applianceId], references: [id])

            assignedTechnician User? @relation("ServiceRequestTechnician", fields: [assignedTechnicianUserId], references: [id])
            createdBy          User  @relation("ServiceRequestCreator", fields: [createdByUserId], references: [id])

            reports ServiceReport[]
            invoice Invoice?

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@unique([tenantId, trackingCode])
            @@index([tenantId])
            @@index([customerId])
            @@index([status])
            @@index([createdAt])
          }

          model ServiceReport {
            id              String @id @default(uuid()) @db.Uuid
            tenantId        String @db.Uuid
            serviceRequestId String @db.Uuid
            technicianUserId String @db.Uuid

            diagnosis       String
            workDone        String
            partsUsedText   String?
            recommendations String?

            tenant         Tenant         @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            serviceRequest ServiceRequest @relation(fields: [serviceRequestId], references: [id], onDelete: Cascade)
            technician     User           @relation("ReportTechnician", fields: [technicianUserId], references: [id])

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([tenantId])
            @@index([serviceRequestId])
          }

          model Invoice {
            id              String @id @default(uuid()) @db.Uuid
            tenantId        String @db.Uuid
            serviceRequestId String @unique @db.Uuid
            customerId      String @db.Uuid

            invoiceNumber String
            subtotal      Decimal @default(0) @db.Decimal(18, 2)
            discount      Decimal @default(0) @db.Decimal(18, 2)
            tax           Decimal @default(0) @db.Decimal(18, 2)
            total         Decimal @default(0) @db.Decimal(18, 2)

            paymentStatus PaymentStatus @default(UNPAID)

            tenant         Tenant         @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            serviceRequest ServiceRequest @relation(fields: [serviceRequestId], references: [id], onDelete: Cascade)
            customer       Customer       @relation(fields: [customerId], references: [id])

            items InvoiceItem[]

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@unique([tenantId, invoiceNumber])
            @@index([tenantId])
            @@index([customerId])
          }

          model InvoiceItem {
            id        String @id @default(uuid()) @db.Uuid
            tenantId  String @db.Uuid
            invoiceId String @db.Uuid

            title     String
            quantity  Int     @default(1)
            unitPrice Decimal @default(0) @db.Decimal(18, 2)
            total     Decimal @default(0) @db.Decimal(18, 2)

            tenant  Tenant  @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            invoice Invoice @relation(fields: [invoiceId], references: [id], onDelete: Cascade)

            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            @@index([tenantId])
            @@index([invoiceId])
          }

          model AuditLog {
            id       String  @id @default(uuid()) @db.Uuid
            tenantId String? @db.Uuid
            userId   String? @db.Uuid

            action     String
            entityType String?
            entityId   String?
            metadata   Json?

            tenant Tenant? @relation(fields: [tenantId], references: [id], onDelete: Cascade)
            user   User?   @relation(fields: [userId], references: [id])

            createdAt DateTime @default(now())

            @@index([tenantId])
            @@index([userId])
            @@index([action])
            @@index([createdAt])
          }
          EOF

