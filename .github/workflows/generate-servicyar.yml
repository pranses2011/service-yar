name: Generate Servicyar MVP Starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project files
        run: |
          mkdir -p prisma
          mkdir -p src/app
          mkdir -p src/lib

          cat > package.json <<'EOF'
          {
            "name": "servicyar",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "dev": "next dev",
              "build": "next build",
              "start": "next start",
              "lint": "next lint",
              "prisma:generate": "prisma generate",
              "prisma:migrate": "prisma migrate dev",
              "prisma:studio": "prisma studio",
              "db:seed": "prisma db seed"
            },
            "dependencies": {
              "@prisma/client": "^6.0.0",
              "bcryptjs": "^2.4.3",
              "date-fns": "^4.1.0",
              "next": "^15.0.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            },
            "devDependencies": {
              "@types/bcryptjs": "^2.4.6",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "prisma": "^6.0.0",
              "tsx": "^4.19.0",
              "typescript": "^5.0.0"
            },
            "prisma": {
              "seed": "tsx prisma/seed.ts"
            }
          }
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          .next/
          out/
          build/
          dist/

          .env
          .env.local
          .env.development.local
          .env.test.local
          .env.production.local

          npm-debug.log*
          yarn-debug.log*
          yarn-error.log*
          pnpm-debug.log*

          .DS_Store
          Thumbs.db

          .vscode/
          .idea/
          EOF

          cat > .env.example <<'EOF'
          DATABASE_URL="postgresql://postgres:password@localhost:5432/servicyar?schema=public"

          SEED_ADMIN_NAME="مدیر کل سرویسیار"
          SEED_ADMIN_MOBILE="09120000000"
          SEED_ADMIN_EMAIL="admin@servicyar.local"
          SEED_ADMIN_PASSWORD="Admin@123456"
          EOF

          cat > docker-compose.yml <<'EOF'
          services:
            postgres:
              image: postgres:16
              container_name: servicyar-postgres
              restart: unless-stopped
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: password
                POSTGRES_DB: servicyar
              ports:
                - "5432:5432"
              volumes:
                - servicyar_postgres_data:/var/lib/postgresql/data

          volumes:
            servicyar_postgres_data:
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2017",
              "lib": ["dom", "dom.iterable", "esnext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "incremental": true,
              "plugins": [
                {
                  "name": "next"
                }
              ],
              "paths": {
                "@/*": ["./src/*"]
              }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          EOF

          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            reactStrictMode: true
          };

          export default nextConfig;
          EOF

          cat > src/app/globals.css <<'EOF'
          * {
            box-sizing: border-box;
          }

          html,
          body {
            margin: 0;
            padding: 0;
            direction: rtl;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7fb;
            color: #111827;
          }

          a {
            color: inherit;
            text-decoration: none;
          }

          .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 16px;
          }

          .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
          }

          .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
          }

          .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 18px;
            font-weight: 700;
            margin-top: 16px;
          }

          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
          }

          .feature {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px;
          }

          .muted {
            color: #6b7280;
            line-height: 1.9;
          }
          EOF

          cat > src/app/layout.tsx <<'EOF'
          import type { Metadata } from "next";
          import "./globals.css";

          export const metadata: Metadata = {
            title: "سرویسیار | سامانه مدیریت خدمات پس از فروش",
            description: "وب اپلیکیشن فارسی و ماژولار برای مدیریت تعمیرات و خدمات پس از فروش لوازم خانگی"
          };

          export default function RootLayout({
            children
          }: Readonly<{
            children: React.ReactNode;
          }>) {
            return (
              <html lang="fa" dir="rtl">
                <body>{children}</body>
              </html>
            );
          }
          EOF

          cat > src/app/page.tsx <<'EOF'
          export default function HomePage() {
            return (
              <main className="container">
                <section className="card">
                  <span className="badge">نسخه MVP سرویسیار</span>

                  <h1>سرویسیار؛ سامانه جامع مدیریت خدمات پس از فروش لوازم خانگی</h1>

                  <p className="muted">
                    این پروژه پایه اولیه وب اپلیکیشن سرویسیار است. هدف محصول، مدیریت مشتریان،
                    درخواست‌های تعمیر، تکنسین‌ها، فاکتورها، گزارش تعمیر، لایسنس و ماژول‌های قابل فروش است.
                  </p>

                  <a className="button" href="https://github.com" target="_blank">
                    شروع توسعه محصول
                  </a>
                </section>

                <section className="grid">
                  <div className="feature">
                    <h3>مدیریت مشتریان</h3>
                    <p className="muted">ثبت مشتری، شماره موبایل، آدرس‌ها و سوابق تعمیر.</p>
                  </div>

                  <div className="feature">
                    <h3>درخواست تعمیر</h3>
                    <p className="muted">ثبت مشکل دستگاه، وضعیت کار، تکنسین و کد پیگیری.</p>
                  </div>

                  <div className="feature">
                    <h3>فاکتور و گزارش</h3>
                    <p className="muted">ثبت گزارش تعمیر و صدور فاکتور ساده برای مشتری.</p>
                  </div>

                  <div className="feature">
                    <h3>لایسنس و ماژول</h3>
                    <p className="muted">فعال‌سازی کسب‌وکارها با کد لایسنس و پلن‌های قابل فروش.</p>
