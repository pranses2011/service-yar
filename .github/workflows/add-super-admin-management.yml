            searchParams
          }: {
            searchParams?: Promise<{ q?: string; error?: string; success?: string }>;
          }) {
            await requireSuperAdminContext();

            const params = await searchParams;
            const q = String(params?.q || "").trim();

            const tenants = await prisma.tenant.findMany({
              where: {
                ...(q
                  ? {
                      OR: [
                        {
                          name: {
                            contains: q,
                            mode: "insensitive"
                          }
