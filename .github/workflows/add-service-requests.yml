          # Update dashboard and customer navigation links where possible
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("src/app/dashboard/page.tsx"),
              Path("src/app/dashboard/customers/page.tsx"),
              Path("src/app/dashboard/customers/new/page.tsx"),
              Path("src/app/dashboard/customers/[customerId]/page.tsx"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = text.replace(
                  '<a href="#">درخواست‌های تعمیر</a>',
                  '<Link href="/dashboard/service-requests">درخواست‌های تعمیر</Link>'
              )

              path.write_text(text)
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add service requests module"
            git push
          fi

      - name: Create ZIP file
        run: |
          zip -r servicyar-service-requests.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicyar-service-requests
          path: servicyar-service-requests.zip
