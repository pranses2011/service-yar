name: Add Deployment Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deployment files
        shell: bash
        run: |
          set -e

          mkdir -p src/app/api/health
          mkdir -p docs

          cat > vercel.json <<'EOF'
          {
            "buildCommand": "prisma generate && next build",
            "installCommand": "npm install",
            "framework": "nextjs"
          }
          EOF

          cat > src/app/api/health/route.ts <<'EOF'
          import { NextResponse } from "next/server";

          export async function GET() {
            return NextResponse.json({
              ok: true,
              app: "servicyar",
              message: "سرویسیار فعال است.",
              timestamp: new Date().toISOString()
            });
          }
          EOF

          cat > docs/DEPLOYMENT.md <<'EOF'
          # راهنمای Deploy آنلاین سرویسیار

          برای اجرای آنلاین سرویسیار بدون کامپیوتر، پیشنهاد می‌شود از این ترکیب استفاده کنید:

          - GitHub برای نگهداری کد
          - Supabase یا Neon برای PostgreSQL
          - Vercel برای اجرای Next.js

          ## مرحله 1: ساخت دیتابیس

          یکی از سرویس‌های زیر را انتخاب کنید:

          - https://supabase.com
          - https://neon.tech

          بعد از ساخت دیتابیس، مقدار `DATABASE_URL` را دریافت کنید.

          ## مرحله 2: ثبت Environment Variable در Vercel

          در Vercel، هنگام Deploy پروژه، این مقدار را اضافه کنید:

          ```text
          DATABASE_URL
          ```

          همچنین این مقادیر برای Seed اولیه لازم هستند:

          ```text
          SEED_ADMIN_NAME
          SEED_ADMIN_MOBILE
          SEED_ADMIN_EMAIL
          SEED_ADMIN_PASSWORD
          ```

          نمونه:

          ```text
          SEED_ADMIN_NAME=مدیر کل سرویسیار
          SEED_ADMIN_MOBILE=09120000000
          SEED_ADMIN_EMAIL=admin@servicyar.local
          SEED_ADMIN_PASSWORD=Admin@123456
          ```

          ## مرحله 3: Deploy روی Vercel

          1. وارد https://vercel.com شوید.
          2. با GitHub لاگین کنید.
          3. روی Add New Project بزنید.
          4. Repository سرویسیار را انتخاب کنید.
          5. Environment Variables را وارد کنید.
          6. Deploy را بزنید.

          ## تست سلامت پروژه

          بعد از Deploy این مسیر را باز کنید:

          ```text
          /api/health
          ```

          اگر پاسخ شامل `ok: true` بود، پروژه زنده است.

          ## هشدار امنیتی

          هیچ‌وقت این موارد را داخل GitHub Commit نکنید:

          - GitHub Token
          - DATABASE_URL واقعی
          - رمز دیتابیس
          - رمز مدیر کل
          - کلید پیامک
          - کلید درگاه پرداخت
          EOF

          cat > docs/PRODUCT_ROADMAP.md <<'EOF'
          # نقشه راه محصول سرویسیار

          ## امکانات MVP فعلی

          - ورود و ثبت‌نام
          - ساخت کسب‌وکار
          - فعال‌سازی با کد لایسنس
          - مدیریت مشتریان
          - مدیریت آدرس مشتری
          - مدیریت دستگاه مشتری
          - ثبت درخواست تعمیر
          - مدیریت وضعیت درخواست
          - مدیریت تکنسین‌ها
          - ثبت گزارش تعمیر
          - صدور فاکتور
          - چاپ فاکتور فارسی
          - پنل مدیر کل
          - مدیریت لایسنس‌ها
          - مدیریت ماژول‌های فعال هر کسب‌وکار

          ## فازهای بعدی

          1. تنظیمات کسب‌وکار
          2. پروفایل کاربر
          3. تغییر رمز
          4. گزارش‌های مدیریتی
          5. گارانتی خدمات
          6. پیامک
          7. انبار قطعات
          8. درگاه پرداخت
          9. پنل مشتری نهایی
          10. PWA موبایل
          EOF

          cat > docs/SECURITY_NOTES.md <<'EOF'
          # نکات امنیتی سرویسیار

          ## موارد انجام‌شده

          - رمز کاربران با bcrypt هش می‌شود.
          - داده‌ها با tenantId جدا می‌شوند.
          - نقش‌های کاربری تعریف شده‌اند.
          - ماژول‌ها بر اساس Tenant کنترل می‌شوند.
          - عملیات مهم در AuditLog ثبت می‌شود.

          ## موارد لازم قبل از فروش جدی

          - Session امن‌تر
          - Rate Limit فرم ورود
          - تغییر رمز
          - بازیابی رمز
          - OTP پیامکی
          - بررسی وضعیت License در همه عملیات
          - بکاپ دیتابیس
          - مانیتورینگ خطا
          EOF

          node <<'NODE'
          const fs = require("fs");

          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!pkg.scripts) {
            pkg.scripts = {};
          }

          if (!pkg.scripts.dev) {
            pkg.scripts.dev = "next dev";
          }

          if (!pkg.scripts.build) {
            pkg.scripts.build = "next build";
          }

          if (!pkg.scripts.start) {
            pkg.scripts.start = "next start";
          }

          pkg.scripts.postinstall = "prisma generate";
          pkg.scripts["prisma:generate"] = "prisma generate";
          pkg.scripts["prisma:push"] = "prisma db push";
          pkg.scripts["prisma:studio"] = "prisma studio";
          pkg.scripts["db:seed"] = "prisma db seed";
          pkg.scripts["db:push-seed"] = "prisma db push && prisma db seed";

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cat > README.md <<'EOF'
          # سرویسیار

          **سرویسیار** یک وب اپلیکیشن فارسی، راست‌چین و ماژولار برای مدیریت خدمات پس از فروش و تعمیرات لوازم خانگی است.

          هدف محصول این است که به تعمیرکاران، تیم‌های خدماتی و نمایندگی‌ها فروخته شود و با کد فعال‌سازی و ماژول‌های قابل انتخاب کار کند.

          ## امکانات MVP

          - ورود و ثبت‌نام
          - ساخت کسب‌وکار
          - فعال‌سازی با کد لایسنس
          - مدیریت مشتریان
          - مدیریت آدرس مشتری
          - مدیریت دستگاه مشتری
          - ثبت درخواست تعمیر
          - مدیریت وضعیت درخواست
          - مدیریت تکنسین‌ها
          - ثبت گزارش تعمیر
          - صدور فاکتور
          - چاپ فاکتور فارسی
          - پنل مدیر کل
          - ساخت و مدیریت لایسنس
          - مدیریت ماژول‌های فعال هر کسب‌وکار

          ## تکنولوژی‌ها

          - Next.js
          - TypeScript
          - PostgreSQL
          - Prisma
          - GitHub Actions
          - Vercel-ready

          ## مسیرهای اصلی

          ```text
          /auth/login
          /auth/register
          /dashboard
          /dashboard/customers
          /dashboard/service-requests
          /dashboard/technicians
          /dashboard/invoices
          /super-admin
          /api/health
          ```

          ## راهنمای Deploy

          راهنمای Deploy در این مسیر قرار دارد:

          ```text
          docs/DEPLOYMENT.md
          ```

          ## هشدار امنیتی

          فایل `.env`، توکن‌ها، `DATABASE_URL` واقعی و رمزها نباید داخل GitHub Commit شوند.
          EOF

      - name: Commit generated files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add deployment tools and documentation"
            git push
          fi

      - name: Create ZIP file
        shell: bash
        run: |
          zip -r servicyar-deployment-tools.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicyar-deployment-tools
          path: servicyar-deployment-tools.zip
