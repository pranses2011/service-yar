name: Add Deployment Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deployment tools safely
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/app/api/health
          mkdir -p .github/workflows
          mkdir -p docs

          cat > vercel.json <<'EOF'
          {
            "buildCommand": "prisma generate && next build",
            "installCommand": "npm install",
            "framework": "nextjs"
          }
          EOF

          cat > src/app/api/health/route.ts <<'EOF'
          import { NextResponse } from "next/server";

          export async function GET() {
            return NextResponse.json({
              ok: true,
              app: "servicyar",
              message: "سرویسیار فعال است.",
              timestamp: new Date().toISOString()
            });
          }
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI Build Check

          on:
            workflow_dispatch:
            push:
              branches:
                - main

          jobs:
            build:
              runs-on: ubuntu-latest

              env:
                DATABASE_URL: "postgresql://postgres:password@localhost:5432/servicyar?schema=public"
                SEED_ADMIN_NAME: "مدیر کل سرویسیار"
                SEED_ADMIN_MOBILE: "09120000000"
                SEED_ADMIN_EMAIL: "admin@servicyar.local"
                SEED_ADMIN_PASSWORD: "Admin@123456"

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Generate Prisma Client
                  run: npx prisma generate

                - name: Build project
                  run: npm run build
          EOF

          # برای جلوگیری از تفسیر زودهنگام GitHub Actions expressions
          # عبارت ${{ ... }} را با متغیر می‌سازیم.
          GHA='$'

          cat > .github/workflows/db-push-seed.yml <<EOF
          name: Database Push and Seed

          on:
            workflow_dispatch:
              inputs:
                run_seed:
                  description: "آیا Seed اولیه اجرا شود؟"
                  required: true
                  default: "yes"
                  type: choice
                  options:
                    - "yes"
                    - "no"

          jobs:
            db:
              runs-on: ubuntu-latest

              env:
                DATABASE_URL: ${GHA}{{ secrets.DATABASE_URL }}
                SEED_ADMIN_NAME: ${GHA}{{ secrets.SEED_ADMIN_NAME }}
                SEED_ADMIN_MOBILE: ${GHA}{{ secrets.SEED_ADMIN_MOBILE }}
                SEED_ADMIN_EMAIL: ${GHA}{{ secrets.SEED_ADMIN_EMAIL }}
                SEED_ADMIN_PASSWORD: ${GHA}{{ secrets.SEED_ADMIN_PASSWORD }}

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Generate Prisma Client
                  run: npx prisma generate

                - name: Push Prisma schema to database
                  run: npx prisma db push

                - name: Seed database
                  if: ${GHA}{{ github.event.inputs.run_seed == 'yes' }}
                  run: npm run db:seed
          EOF

          cat > docs/DEPLOYMENT.md <<'EOF'
          # راهنمای Deploy آنلاین سرویسیار

          این پروژه برای اجرای آنلاین با این ترکیب آماده شده است:

          - GitHub برای نگهداری کد
          - Supabase یا Neon برای PostgreSQL
          - Vercel برای اجرای Next.js

          ## 1. ساخت دیتابیس آنلاین

          یکی از این سرویس‌ها را انتخاب کنید:

          - https://supabase.com
          - https://neon.tech

          بعد از ساخت دیتابیس، مقدار `DATABASE_URL` را بردارید.

          ## 2. ثبت Secretها در GitHub

          مسیر:

          ```text
          Repository → Settings → Secrets and variables → Actions → New repository secret
          ```

          این Secretها را اضافه کنید:

          ```text
          DATABASE_URL
          SEED_ADMIN_NAME
          SEED_ADMIN_MOBILE
          SEED_ADMIN_EMAIL
          SEED_ADMIN_PASSWORD
          ```

          مقدارهای نمونه:

          ```text
          SEED_ADMIN_NAME=مدیر کل سرویسیار
          SEED_ADMIN_MOBILE=09120000000
          SEED_ADMIN_EMAIL=admin@servicyar.local
          SEED_ADMIN_PASSWORD=Admin@123456
          ```

          ## 3. ساخت جدول‌ها و Seed

          از تب Actions این Workflow را اجرا کنید:

          ```text
          Database Push and Seed
          ```

          گزینه `run_seed` را روی `yes` بگذارید.

          ## 4. Deploy روی Vercel

          در Vercel پروژه GitHub را Import کنید و Environment Variables را وارد کنید.

          مسیر تست:

          ```text
          /api/health
          ```

          اگر پاسخ `ok: true` برگشت، پروژه زنده است.

          ## هشدار امنیتی

          هیچ‌وقت این موارد را داخل فایل‌های GitHub ننویسید:

          - GitHub Token
          - DATABASE_URL واقعی
          - رمز دیتابیس
          - رمز مدیر کل
          - کلیدهای پیامک یا پرداخت
          EOF

          cat > docs/PRODUCT_ROADMAP.md <<'EOF'
          # نقشه راه محصول سرویسیار

          ## MVP فعلی

          - ورود و ثبت‌نام
          - ساخت کسب‌وکار
          - فعال‌سازی لایسنس
          - مشتریان
          - آدرس‌ها
          - دستگاه‌ها
          - درخواست‌های تعمیر
          - تکنسین‌ها
          - گزارش تعمیر
          - فاکتور
          - چاپ فاکتور
          - پنل مدیر کل
          - مدیریت لایسنس‌ها
          - مدیریت ماژول‌های کسب‌وکار

          ## فازهای بعدی

          1. تنظیمات کسب‌وکار
          2. پروفایل کاربر و تغییر رمز
          3. گزارش‌های مدیریتی
          4. گارانتی خدمات
          5. پیامک
          6. انبار قطعات
          7. درگاه پرداخت
          8. پنل مشتری نهایی
          9. PWA موبایل
          EOF

          cat > docs/SECURITY_NOTES.md <<'EOF'
          # نکات امنیتی سرویسیار

          ## موارد انجام‌شده

          - رمز کاربران با bcrypt هش می‌شود.
          - داده‌ها با tenantId جدا می‌شوند.
          - نقش‌های کاربری تعریف شده‌اند.
          - ماژول‌ها بر اساس Tenant کنترل می‌شوند.
          - عملیات مهم در AuditLog ثبت می‌شود.

          ## موارد لازم قبل از فروش جدی

          - Session امن‌تر
          - Rate Limit فرم ورود
          - تغییر رمز
          - بازیابی رمز
          - OTP پیامکی
          - بررسی وضعیت License در همه عملیات
          - بکاپ دیتابیس
          - مانیتورینگ خطا با Sentry
          EOF

          node <<'NODE'
          const fs = require("fs");

          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

          pkg.scripts = {
            ...pkg.scripts,
            dev: pkg.scripts?.dev || "next dev",
            build: pkg.scripts?.build || "next build",
            start: pkg.scripts?.start || "next start",
            postinstall: "prisma generate",
            "prisma:generate": "prisma generate",
            "prisma:push": "prisma db push",
            "prisma:studio": "prisma studio",
            "db:seed": "prisma db seed",
            "db:push-seed": "prisma db push && prisma db seed"
          };

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cat > README.md <<'EOF'
          # سرویسیار

          **سرویسیار** یک وب اپلیکیشن فارسی، راست‌چین و ماژولار برای مدیریت خدمات پس از فروش و تعمیرات لوازم خانگی است.

          ## امکانات MVP

          - ورود و ثبت‌نام
          - ساخت کسب‌وکار
          - فعال‌سازی با کد لایسنس
          - مدیریت مشتریان
          - مدیریت آدرس مشتری
          - مدیریت دستگاه مشتری
          - ثبت درخواست تعمیر
          - مدیریت وضعیت درخواست
          - مدیریت تکنسین‌ها
          - ثبت گزارش تعمیر
          - صدور فاکتور
          - چاپ فاکتور فارسی
          - پنل مدیر کل
          - ساخت و مدیریت لایسنس
          - مدیریت ماژول‌های فعال هر کسب‌وکار

          ## تکنولوژی‌ها

          - Next.js
          - TypeScript
          - PostgreSQL
          - Prisma
          - GitHub Actions
          - Vercel-ready

          ## مسیرهای اصلی

          ```text
          /auth/login
          /auth/register
          /dashboard
          /dashboard/customers
          /dashboard/service-requests
          /dashboard/technicians
          /dashboard/invoices
          /super-admin
          /api/health
          ```

          ## راهنمای Deploy

          ```text
          docs/DEPLOYMENT.md
          ```

          ## هشدار امنیتی

          فایل `.env`، توکن‌ها، `DATABASE_URL` واقعی و رمزها نباید داخل GitHub Commit شوند.
          EOF

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add deployment tools, CI, database workflow and docs"
            git push
          fi

      - name: Create ZIP file
        shell: bash
        run: |
          zip -r servicyar-deployment-tools.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicyar-deployment-tools
          path: servicyar-deployment-tools.zip
