          python - <<'PY'
          from pathlib import Path

          files = [
              Path("src/app/dashboard/page.tsx"),
              Path("src/app/dashboard/customers/page.tsx"),
              Path("src/app/dashboard/customers/new/page.tsx"),
              Path("src/app/dashboard/customers/[customerId]/page.tsx"),
              Path("src/app/dashboard/service-requests/page.tsx"),
              Path("src/app/dashboard/service-requests/new/page.tsx"),
              Path("src/app/dashboard/service-requests/[requestId]/page.tsx"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = text.replace(
                  '<a href="#">تکنسین‌ها</a>',
                  '<Link href="/dashboard/technicians">تکنسین‌ها</Link>'
              )

              path.write_text(text)
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add technicians and service reports module"
            git push
          fi

      - name: Create ZIP file
        run: |
          zip -r servicyar-technicians-reports.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: servicyar-technicians-reports
          path: servicyar-technicians-reports.zip
