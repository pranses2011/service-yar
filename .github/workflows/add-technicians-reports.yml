name: Add Technicians and Service Reports Module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate technicians and reports module files
        run: |
          mkdir -p src/app/dashboard/technicians
          mkdir -p src/app/dashboard/technicians/new
          mkdir -p 'src/app/dashboard/technicians/[technicianUserId]'
          mkdir -p src/app/dashboard/service-reports
          mkdir -p 'src/app/dashboard/service-requests/[requestId]/report'

          cat > src/app/dashboard/technicians/actions.ts <<'EOF'
          "use server";

          import bcrypt from "bcryptjs";
          import { redirect } from "next/navigation";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requirePermission } from "@/lib/permissions";
          import { requireTenantContext } from "@/lib/tenant-context";
          import { getTenantActiveLicense } from "@/lib/license";

          function cleanText(value: FormDataEntryValue | null) {
            return String(value || "").trim();
          }

          function errorRedirect(path: string, message: string): never {
            redirect(`${path}?error=${encodeURIComponent(message)}`);
          }

          export async function createTechnicianAction(formData: FormData) {
            const context = await requireTenantContext();

            await requireModule(context.tenantId, "technicians");
            requirePermission(context.role, "users.manage");

            const name = cleanText(formData.get("name"));
            const mobile = cleanText(formData.get("mobile"));
            const emailRaw = cleanText(formData.get("email"));
            const email = emailRaw || null;
            const password = cleanText(formData.get("password"));

            if (!name || !mobile || !password) {
              errorRedirect("/dashboard/technicians/new", "نام، شماره موبایل و رمز عبور تکنسین الزامی است.");
            }

            if (password.length < 8) {
              errorRedirect("/dashboard/technicians/new", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
            }

            const activeLicense = await getTenantActiveLicense(context.tenantId);

            if (!activeLicense) {
              errorRedirect("/dashboard/technicians/new", "اشتراک فعال پیدا نشد.");
            }

            const currentTechniciansCount = await prisma.tenantUser.count({
              where: {
                tenantId: context.tenantId,
                role: "TECHNICIAN",
                isActive: true
              }
            });

            if (currentTechniciansCount >= activeLicense.maxTechnicians) {
              errorRedirect(
                "/dashboard/technicians/new",
                `سقف تعداد تکنسین در پلن فعلی شما ${activeLicense.maxTechnicians} نفر است.`
              );
            }

            const passwordHash = await bcrypt.hash(password, 12);

            let user = await prisma.user.findUnique({
              where: {
                mobile
              }
            });

            if (!user) {
              user = await prisma.user.create({
                data: {
                  name,
                  mobile,
                  email,
                  passwordHash,
                  globalRole: "USER",
                  isActive: true
                }
              });
            } else {
              await prisma.user.update({
                where: {
                  id: user.id
                },
                data: {
                  name,
                  email,
                  isActive: true
                }
              });
            }

            const existingMembership = await prisma.tenantUser.findUnique({
              where: {
                tenantId_userId: {
                  tenantId: context.tenantId,
                  userId: user.id
                }
              }
            });

            if (existingMembership) {
              if (existingMembership.role === "TECHNICIAN") {
                errorRedirect("/dashboard/technicians/new", "این تکنسین قبلاً برای این کسب‌وکار ثبت شده است.");
              }

              errorRedirect(
                "/dashboard/technicians/new",
                "این کاربر قبلاً با نقش دیگری در کسب‌وکار شما عضو شده است."
              );
            }

            await prisma.tenantUser.create({
              data: {
                tenantId: context.tenantId,
                userId: user.id,
                role: "TECHNICIAN",
                isActive: true
              }
            });

            await prisma.auditLog.create({
              data: {
                tenantId: context.tenantId,
                userId: context.user.id,
                action: "technician.created",
                entityType: "User",
                entityId: user.id,
                metadata: {
                  mobile
                }
              }
            });

            redirect(`/dashboard/technicians/${user.id}`);
          }

          export async function updateTechnicianStatusAction(formData: FormData) {
            const context = await requireTenantContext();

            await requireModule(context.tenantId, "technicians");
            requirePermission(context.role, "users.manage");

            const technicianUserId = cleanText(formData.get("technicianUserId"));
            const nextStatus = cleanText(formData.get("isActive"));

            if (!technicianUserId) {
              errorRedirect("/dashboard/technicians", "شناسه تکنسین معتبر نیست.");
            }

            const membership = await prisma.tenantUser.findFirst({
              where: {
                tenantId: context.tenantId,
                userId: technicianUserId,
                role: "TECHNICIAN"
              }
            });

            if (!membership) {
              errorRedirect("/dashboard/technicians", "تکنسین پیدا نشد.");
            }

            await prisma.tenantUser.update({
              where: {
                id: membership.id
              },
              data: {
                isActive: nextStatus === "true"
              }
            });

            await prisma.auditLog.create({
              data: {
                tenantId: context.tenantId,
                userId: context.user.id,
                action: "technician.status_updated",
                entityType: "User",
                entityId: technicianUserId,
                metadata: {
                  isActive: nextStatus === "true"
                }
              }
            });

            redirect(
              `/dashboard/technicians/${technicianUserId}?success=${encodeURIComponent(
                "وضعیت تکنسین به‌روزرسانی شد."
              )}`
            );
          }
          EOF

          cat > src/app/dashboard/service-reports/actions.ts <<'EOF'
          "use server";

          import { redirect } from "next/navigation";
          import type { ServiceRequestStatus } from "@prisma/client";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requirePermission } from "@/lib/permissions";
          import { requireTenantContext } from "@/lib/tenant-context";

          function cleanText(value: FormDataEntryValue | null) {
            return String(value || "").trim();
          }

          function errorRedirect(path: string, message: string): never {
            redirect(`${path}?error=${encodeURIComponent(message)}`);
          }

          const allowedNextStatuses: ServiceRequestStatus[] = [
            "IN_PROGRESS",
            "WAITING_FOR_PART",
            "COMPLETED"
          ];

          export async function createServiceReportAction(formData: FormData) {
            const context = await requireTenantContext();

            await requireModule(context.tenantId, "service_reports");
            requirePermission(context.role, "service_reports.create");

            const requestId = cleanText(formData.get("requestId"));
            const diagnosis = cleanText(formData.get("diagnosis"));
            const workDone = cleanText(formData.get("workDone"));
            const partsUsedText = cleanText(formData.get("partsUsedText"));
            const recommendations = cleanText(formData.get("recommendations"));
            const nextStatusRaw = cleanText(formData.get("nextStatus")) as ServiceRequestStatus;

            if (!requestId || !diagnosis || !workDone) {
              errorRedirect(
                `/dashboard/service-requests/${requestId}/report`,
                "ایراد تشخیص داده‌شده و شرح کار انجام‌شده الزامی است."
              );
            }

            const request = await prisma.serviceRequest.findFirst({
              where: {
                id: requestId,
                tenantId: context.tenantId
              }
            });

            if (!request) {
              errorRedirect("/dashboard/service-requests", "درخواست تعمیر پیدا نشد.");
            }

            if (
              context.role === "TECHNICIAN" &&
              request.assignedTechnicianUserId !== context.user.id
            ) {
              errorRedirect(
                "/dashboard/service-requests",
                "شما فقط برای درخواست‌های ارجاع‌شده به خودتان می‌توانید گزارش ثبت کنید."
              );
            }

            const nextStatus = allowedNextStatuses.includes(nextStatusRaw)
              ? nextStatusRaw
              : request.status;

            const report = await prisma.serviceReport.create({
              data: {
                tenantId: context.tenantId,
                serviceRequestId: request.id,
                technicianUserId:
                  context.role === "TECHNICIAN"
                    ? context.user.id
                    : request.assignedTechnicianUserId || context.user.id,
                diagnosis,
                workDone,
                partsUsedText: partsUsedText || null,
                recommendations: recommendations || null
              }
            });

            await prisma.serviceRequest.update({
              where: {
                id: request.id
              },
              data: {
                status: nextStatus
              }
            });

            await prisma.auditLog.create({
              data: {
                tenantId: context.tenantId,
                userId: context.user.id,
                action: "service_report.created",
                entityType: "ServiceReport",
                entityId: report.id,
                metadata: {
                  serviceRequestId: request.id,
                  nextStatus
                }
              }
            });

            redirect(
              `/dashboard/service-requests/${request.id}?success=${encodeURIComponent(
                "گزارش تعمیر ثبت شد."
              )}`
            );
          }
          EOF

          cat > src/app/dashboard/technicians/page.tsx <<'EOF'
          import Link from "next/link";
          import { prisma } from "@/lib/prisma";
          import { requireModule } from "@/lib/modules";
          import { requireTenantContext } from "@/lib/tenant-context";
          import { getTenantActiveLicense } from "@/lib/license";

          export default async function TechniciansPage({
            searchParams
          }: {
            searchParams?: Promise<{ q?: string; error?: string; success?: string }>;
          }) {
            const context = await requireTenantContext();
            await requireModule(context.tenantId, "technicians");

            const params = await searchParams;
            const q = String(params?.q || "").trim();

            const [technicians, activeLicense] = await Promise.all([
              prisma.tenantUser.findMany({
                where: {
                  tenantId: context.tenantId,
                  role: "TECHNICIAN",
                  ...(q
                    ? {
                        user: {
                          OR: [
                            {
                              name: {
                                contains: q,
                                mode: "insensitive"
                              }
                            },
                            {
                              mobile: {
                                contains: q
                              }
                            }
                          ]
                        }
                      }
                    : {})
                },
                include: {
                  user: {
                    include: {
                      assignedServiceRequests: {
                        where: {
                          tenantId: context.tenantId
                        }
                      },
                      serviceReports: {
                        where: {
                          tenantId: context.tenantId
                        }
                      }
                    }
                  }
                },
                orderBy: {
                  createdAt: "desc"
                }
              }),
              getTenantActiveLicense(context.tenantId)
            ]);

            const activeTechniciansCount = technicians.filter((item) => item.isActive).length;

            return (
              <main className="app-shell">
                <aside className="sidebar">
                  <div>
                    <h2>سرویسیار</h2>
                    <p>{context.tenant.name}</p>

                    <nav>
                      <Link href="/dashboard">داشبورد</Link>
                      <Link href="/dashboard/customers">مشتریان</Link>
                      <Link href="/dashboard/service-requests">درخواست‌های تعمیر</Link>
                      <Link href="/dashboard/technicians">تکنسین‌ها</Link>
                      <a href="#">فاکتورها</a>
                      <Link href="/auth/activate">اشتراک و لایسنس</Link>
                    </nav>
                  </div>
                </aside>

                <section className="content">
                  <header className="page-header">
                    <div>
                      <span className="badge">مدیریت تکنسین‌ها</span>
                      <h1>تکنسین‌ها</h1>
                      <p className="muted">
                        تکنسین‌ها، درخواست‌های ارجاع‌شده و گزارش‌های تعمیر را مدیریت کنید.
                      </p>
                    </div>

                    <Link className="button" href="/dashboard/technicians/new">
                      + ثبت تکنسین جدید
                    </Link>
                  </header>

                  {params?.error ? <div className="alert error">{params.error}</div> : null}
                  {params?.success ? <div className="alert success">{params.success}</div> : null}

                  <section className="stats-grid">
                    <div className="stat-card small">
                      <span>تکنسین فعال</span>
                      <strong>{activeTechniciansCount}</strong>
                    </div>

                    <div className="stat-card small">
                      <span>سقف پلن</span>
                      <strong>{activeLicense?.maxTechnicians ?? "-"}</strong>
                    </div>

                    <div className="stat-card small">
                      <span>کل تکنسین‌ها</span>
                      <strong>{technicians.length}</strong>
                    </div>
                  </section>

                  <section className="panel">
                    <form className="search-form">
                      <input
                        name="q"
                        defaultValue={q}
                        placeholder="جستجو با نام یا شماره موبایل تکنسین"
                      />
                      <button className="button compact" type="submit">
                        جستجو
                      </button>
                      {q ? (
                        <Link className="secondary-link" href="/dashboard/technicians">
                          حذف فیلتر
                        </Link>
                      ) : null}
                    </form>
                  </section>

                  <section className="panel">
                    {technicians.length === 0 ? (
                      <div className="empty-state">
                        <h3>هنوز تکنسینی ثبت نشده است</h3>
                        <p className="muted">
                          برای ارجاع درخواست‌های تعمیر، ابتدا تکنسین‌ها را تعریف کنید.
                        </p>
                        <Link className="button" href="/dashboard/technicians/new">
                          ثبت اولین تکنسین
                        </Link>
                      </div>
                    ) : (
                      <div className="table-wrapper">
                        <table>
                          <thead>
                            <tr>
                              <th>نام</th>
                              <th>موبایل</th>
                              <th>وضعیت</th>
                              <th>درخواست‌ها</th>
                              <th>گزارش‌ها</th>
                              <th>تاریخ عضویت</th>
                              <th>عملیات</th>
                            </tr>
                          </thead>

                          <tbody>
                            {technicians.map((technician) => (
                              <tr key={technician.id}>
                                <td>
                                  <strong>{technician.user.name}</strong>
                                </td>
                                <td dir="ltr">{technician.user.mobile}</td>
                                <td>
                                  <span className={technician.isActive ? "active-pill" : "inactive-pill"}>
                                    {technician.isActive ? "فعال" : "غیرفعال"}
                                  </span>
                                </td>
                                <td>{technician.user.assignedServiceRequests.length}</td>
                                <td>{technician.user.serviceReports.length}</td>
                                <td>{technician.createdAt.toLocaleDateString("fa-IR")}</td>
                                <td>
                                  <Link
                                    className="table-action"
                                    href={`/dashboard/technicians/${technician.userId}`}
                                  >
                                    مشاهده
                                  </Link>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </section>
                </section>
              </main>
            );
          }
          EOF

